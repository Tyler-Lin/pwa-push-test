<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Push Test</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", sans-serif;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    section { margin-bottom: 24px; }
    button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      font-size: 1rem;
      border: 0;
      border-radius: 10px;
      background: #1f6feb;
      color: #fff;
    }
    button.secondary { background: #6e7781; }
    textarea {
      box-sizing: border-box;
      width: 100%;
      height: 160px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.75rem;
    }
    #error {
      padding: 12px;
      border-radius: 10px;
      background: #ffebe9;
      color: #82071e;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #message { color: #1a7f37; }
    #diagnostics {
      font-size: 0.8rem;
      border-top: 1px solid #8884;
      padding-top: 12px;
    }
    #diagnostics dt { font-weight: 600; }
    #diagnostics dd { margin: 0 0 8px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>iOS PWA 推播測試</h1>

  <div id="error" hidden></div>
  <p id="message" hidden></p>

  <section id="install" hidden>
    <h2>步驟一：加入主畫面</h2>
    <ol>
      <li>點 Safari 下方的「分享」按鈕</li>
      <li>選「加入主畫面」</li>
      <li>關掉 Safari，從主畫面上的 PushTest 圖示開啟</li>
    </ol>
    <p>iOS 只有從主畫面開啟時才能使用推播通知。</p>
  </section>

  <section id="subscribe" hidden>
    <h2>步驟二：開啟通知</h2>
    <button id="enable">開啟通知</button>
  </section>

  <section id="subscribed" hidden>
    <h2>已訂閱</h2>
    <p>把下面的訂閱 JSON 傳到電腦，在 <code>sender/</code> 執行 <code>pbpaste | npm run add</code> 加入訂閱清單。</p>
    <textarea id="subscription" readonly></textarea>
    <button id="copy">複製</button>
    <button id="local-test" class="secondary">本機測試通知</button>
    <button id="unsubscribe" class="secondary">取消訂閱</button>
  </section>

  <dl id="diagnostics"></dl>

  <script type="module" src="app.js"></script>
</body>
</html>
